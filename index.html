        return products.filter(p => {
          const matchStore = selectedStore === "All Stores" || p.stores.includes(selectedStore);

            p.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
            p.brand.toLowerCase().includes(searchQuery.toLowerCase()) ||
            p.category.toLowerCase().includes(searchQuery.toLowerCase()) ||
            p.notes.toLowerCase().includes(searchQuery.toLowerCase());

        const query = searchQuery.trim().toLowerCase();

          p.name.toLowerCase().includes(query) ||
          p.category.toLowerCase().includes(query) ||
          p.brand.toLowerCase().includes(query) ||
          p.notes.toLowerCase().includes(query)

          const matching = base.filter(p => p.stores.includes(store));
          return {
            store,
            count: matching.length,
            items: matching
          };

                                <span>✓</span> Bobby Approved
                              </span>
                              <span className="bg-slate-900/80 backdrop-blur-sm text-white font-medium text-[10px] px-2 py-0.5 rounded-md">
                                {item.category}
                              </span>
                            </div>
                            <span className="absolute bottom-2 right-2 bg-white/95 text-slate-800 font-bold text-xs px-2 py-0.5 rounded-md shadow-sm">
                              {item.price}
                            </span>
                          </div>

                          {/* Content */}
                          <div className="p-3.5 space-y-1.5">
                            <div className="flex items-start justify-between gap-2">
                              <div>
                                <h3 className="font-bold text-sm text-slate-900 leading-snug">{item.name}</h3>
                                <p className="text-xs font-semibold text-emerald-700">{item.brand}</p>
                              </div>
                            </div>
                            <p className="text-xs text-slate-600 leading-relaxed line-clamp-3 bg-slate-50 p-2 rounded-lg border border-slate-100">
                              {item.notes}
                            </p>
                          </div>
                        </div>

                        {/* Stores & Action Footer */}
                        <div className="px-3.5 pb-3 pt-1 border-t border-slate-100 flex items-center justify-between gap-2">
                          <div className="flex items-center gap-1 flex-wrap">
                            {item.stores.map(st => (
                              <span key={st} className="text-[10px] bg-slate-100 text-slate-700 px-2 py-0.5 rounded font-medium">
                                🏬 {st}
                              </span>
                            ))}
                          </div>
                          <button
                            onClick={() => addProductToList(item)}
                            className="bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white text-xs font-semibold px-2.5 py-1.5 rounded-lg flex items-center gap-1 transition shadow-sm whitespace-nowrap"
                          >
                            <span>+ List</span>
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

            {/* VIEW 2: WHERE SHOULD I GO? STORE DECIDER */}
            {currentTab === "decider" && (
              <div className="space-y-4">
                <div className="bg-gradient-to-r from-emerald-800 to-teal-800 text-white rounded-2xl p-4 shadow-sm space-y-1.5">
                  <h2 className="font-bold text-base flex items-center gap-2">
                    <span>🧭</span> Store Trip Decider
                  </h2>
                  <p className="text-xs text-emerald-100 leading-relaxed">
                    Not sure where to drive? Search what you want to buy (e.g. <i>"sourdough"</i>, <i>"milk"</i>, or <i>"grass-fed butter"</i>) and see which store has the most approved options!
                  </p>
                </div>

                <div className="space-y-3">
                  {storeStats.map((stat, idx) => (
                    <div 
                      key={stat.store}
                      className="bg-white rounded-xl border border-slate-200 p-4 shadow-sm hover:border-emerald-300 transition"
                    >
                      <div className="flex items-center justify-between pb-2 border-b border-slate-100">
                        <div className="flex items-center gap-2">
                          <span className={`w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold ${
                            idx === 0 ? "bg-amber-400 text-slate-900" : "bg-slate-100 text-slate-600"
                          }`}>
                            #{idx + 1}
                          </span>
                          <h3 className="font-bold text-slate-900 text-sm">{stat.store}</h3>
                        </div>
                        <span className="bg-emerald-50 text-emerald-800 border border-emerald-200 text-xs font-bold px-2.5 py-0.5 rounded-full">
                          {stat.count} Clean Items Found
                        </span>
                      </div>

                      {stat.items.length > 0 ? (
                        <div className="mt-3 grid grid-cols-2 sm:grid-cols-3 gap-2">
                          {stat.items.slice(0, 3).map(it => (
                            <div key={it.id} className="bg-slate-50 border border-slate-100 rounded-lg p-2 text-left">
                              <p className="font-semibold text-[11px] text-slate-800 truncate">{it.name}</p>
                              <p className="text-[10px] text-emerald-700 font-medium">{it.brand}</p>
                              <p className="text-[10px] text-slate-500 font-bold mt-1">{it.price}</p>
                            </div>
                          ))}
                        </div>
                      ) : (
                        <p className="text-xs text-slate-400 italic mt-2">No matching items in this store.</p>
                      )}

                      <div className="mt-3 pt-2 flex items-center justify-between text-xs">
                        <button 
                          onClick={() => { setSelectedStore(stat.store); setCurrentTab("catalog"); }}
                          className="text-emerald-700 font-bold hover:underline flex items-center gap-1"
                        >
                          View all {stat.store} items →
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* VIEW 3: COLLABORATIVE FAMILY SHOPPING LIST */}
            {currentTab === "list" && (
              <div className="space-y-4">
                
                {/* Add Quick List Bar */}
                <form onSubmit={handleAddCustomList} className="bg-white p-3.5 rounded-xl border border-slate-200 shadow-sm space-y-2.5">
                  <div className="flex gap-2">
                    <input
                      type="text"
                      placeholder="Add item (e.g. Grassfed milk, Ezekiel bread)..."
                      value={listInput}
                      onChange={(e) => setListInput(e.target.value)}
                      className="flex-1 bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-xs text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-600"
                    />
                    <button
                      type="submit"
                      className="bg-emerald-700 hover:bg-emerald-800 text-white font-bold text-xs px-4 py-2 rounded-lg transition shadow-sm"
                    >
                      + Add
                    </button>
                  </div>
                  
                  <div className="flex items-center justify-between gap-2 text-xs">
                    <div className="flex items-center gap-1.5">
                      <span className="text-slate-500 font-medium">For:</span>
                      <select 
                        value={listMember}
                        onChange={(e) => setListMember(e.target.value)}
                        className="bg-slate-100 border border-slate-200 text-slate-700 rounded px-2 py-1 text-xs font-semibold focus:outline-none"
                      >
                        {FAMILY_MEMBERS.map(m => <option key={m} value={m}>{m}</option>)}
                      </select>
                    </div>

                    <div className="flex items-center gap-1.5">
                      <span className="text-slate-500 font-medium">Store:</span>
                      <select 
                        value={listStore}
                        onChange={(e) => setListStore(e.target.value)}
                        className="bg-slate-100 border border-slate-200 text-slate-700 rounded px-2 py-1 text-xs font-semibold focus:outline-none"
                      >
                        {STORES.filter(s => s !== "All Stores").map(s => <option key={s} value={s}>{s}</option>)}
                      </select>
                    </div>
                  </div>
                </form>

                {/* Filter List by Current Store */}
                <div className="flex items-center justify-between bg-white px-3 py-2 rounded-xl border border-slate-200">
                  <span className="text-xs font-bold text-slate-600">Filter Shopping List:</span>
                  <select 
                    value={listStoreFilter}
                    onChange={(e) => setListStoreFilter(e.target.value)}
                    className="bg-emerald-50 text-emerald-900 border border-emerald-200 text-xs font-bold rounded-lg px-2.5 py-1 focus:outline-none"
                  >
                    <option value="All Stores">All Stores ({shoppingList.length})</option>
                    {STORES.filter(s => s !== "All Stores").map(s => {
                      const ct = shoppingList.filter(item => item.store === s).length;
                      return <option key={s} value={s}>{s} ({ct})</option>;
                    })}
                  </select>
                </div>

                {/* Items List */}
                <div className="space-y-2">
                  {shoppingList
                    .filter(item => listStoreFilter === "All Stores" || item.store === listStoreFilter)
                    .map(item => (
                      <div 
                        key={item.id}
                        className={`p-3 rounded-xl border transition flex items-center justify-between gap-3 ${
                          item.done 
                            ? "bg-slate-100/70 border-slate-200 opacity-60 line-through" 
                            : "bg-white border-slate-200 shadow-sm"
                        }`}
                      >
                        <div className="flex items-center gap-3">
                          <input 
                            type="checkbox"
                            checked={item.done}
                            onChange={() => {
                              setShoppingList(prev => prev.map(i => i.id === item.id ? { ...i, done: !i.done } : i));
                            }}
                            className="w-4 h-4 rounded text-emerald-600 focus:ring-emerald-500 border-slate-300"
                          />
                          <div>
                            <p className="font-bold text-xs text-slate-800">{item.title}</p>
                            <div className="flex items-center gap-2 mt-0.5">
                              <span className="text-[10px] bg-slate-100 text-slate-600 px-1.5 py-0.2 rounded font-medium">
                                🏬 {item.store}
                              </span>
                              <span className="text-[10px] bg-emerald-100 text-emerald-800 px-1.5 py-0.2 rounded font-semibold">
                                👤 {item.addedBy}
                              </span>
                              {item.brand && (
                                <span className="text-[10px] text-slate-400">({item.brand})</span>
                              )}
                            </div>
                          </div>
                        </div>

                        {/* Qty & Delete */}
                        <div className="flex items-center gap-2">
                          <div className="flex items-center bg-slate-100 rounded-lg border border-slate-200 text-xs">
                            <button 
                              onClick={() => {
                                setShoppingList(prev => prev.map(i => i.id === item.id && i.qty > 1 ? { ...i, qty: i.qty - 1 } : i));
                              }}
                              className="px-2 py-0.5 text-slate-600 hover:text-slate-900"
                            >-</button>
                            <span className="px-1 text-slate-800 font-bold">{item.qty}</span>
                            <button 
                              onClick={() => {
                                setShoppingList(prev => prev.map(i => i.id === item.id ? { ...i, qty: i.qty + 1 } : i));
                              }}
                              className="px-2 py-0.5 text-slate-600 hover:text-slate-900"
                            >+</button>
                          </div>
                          
                          <button 
                            onClick={() => {
                              setShoppingList(prev => prev.filter(i => i.id !== item.id));
                            }}
                            className="text-slate-400 hover:text-red-600 text-xs p-1"
                          >
                            🗑
                          </button>
                        </div>
                      </div>
                    ))}
                </div>

                {shoppingList.length > 0 && (
                  <div className="flex justify-end pt-2">
                    <button
                      onClick={() => {
                        if (confirm("Clear all purchased (checked) items?")) {
                          setShoppingList(prev => prev.filter(i => !i.done));
                        }
                      }}
                      className="text-xs text-slate-500 hover:text-slate-800 font-medium"
                    >
                      Clear checked items
                    </button>
                  </div>
                )}
              </div>
            )}

            {/* VIEW 4: SNAP & ADD NEW CLEAN FOOD PHOTO */}
            {currentTab === "add" && (
              <div className="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm space-y-4">
                <div>
                  <h2 className="font-bold text-base text-slate-900 flex items-center gap-2">
                    <span>📸</span> Save New Clean Food Discovery
                  </h2>
                  <p className="text-xs text-slate-500">
                    Snap an ingredient photo in-store or upload a picture to store it in your family library.
                  </p>
                </div>

                <form onSubmit={handleSaveNewProduct} className="space-y-3.5">
                  
                  {/* Photo Preview & Input */}
                  <div className="space-y-1.5">
                    <label className="text-xs font-bold text-slate-700">Food Picture</label>
                    <div className="flex items-center gap-3">
                      <div className="w-20 h-20 rounded-xl bg-slate-100 border border-slate-200 overflow-hidden flex items-center justify-center">
                        {newImage ? (
                          <img src={newImage} alt="Preview" className="w-full h-full object-cover" />
                        ) : (
                          <span className="text-2xl text-slate-300">📷</span>
                        )}
                      </div>
                      <label className="bg-emerald-50 text-emerald-800 hover:bg-emerald-100 border border-emerald-300 px-3 py-2 rounded-xl text-xs font-bold cursor-pointer transition">
                        Take / Upload Photo
                        <input type="file" accept="image/*" capture="environment" onChange={handleImageUpload} className="hidden" />
                      </label>
                    </div>
                  </div>

                  {/* Product Title */}
                  <div className="space-y-1">
                    <label className="text-xs font-bold text-slate-700">Product Name</label>
                    <input
                      type="text"
                      placeholder="e.g. Grass-Fed A2 Whole Milk"
                      value={newTitle}
                      onChange={(e) => setNewTitle(e.target.value)}
                      required
                      className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs focus:ring-2 focus:ring-emerald-600 focus:outline-none"
                    />
                  </div>

                  {/* Brand & Price */}
                  <div className="grid grid-cols-2 gap-2">
                    <div className="space-y-1">
                      <label className="text-xs font-bold text-slate-700">Brand</label>
                      <input
                        type="text"
                        placeholder="e.g. Maple Hill"
                        value={newBrand}
                        onChange={(e) => setNewBrand(e.target.value)}
                        required
                        className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs focus:ring-2 focus:ring-emerald-600 focus:outline-none"
                      />
                    </div>
                    <div className="space-y-1">
                      <label className="text-xs font-bold text-slate-700">Price (Approx)</label>
                      <input
                        type="text"
                        placeholder="e.g. $5.49"
                        value={newPrice}
                        onChange={(e) => setNewPrice(e.target.value)}
                        className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs focus:ring-2 focus:ring-emerald-600 focus:outline-none"
                      />
                    </div>
                  </div>

                  {/* Category */}
                  <div className="space-y-1">
                    <label className="text-xs font-bold text-slate-700">Category</label>
                    <select
                      value={newCategory}
                      onChange={(e) => setNewCategory(e.target.value)}
                      className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs font-medium focus:ring-2 focus:ring-emerald-600 focus:outline-none"
                    >
                      {CATEGORIES.filter(c => c !== "All").map(c => <option key={c} value={c}>{c}</option>)}
                    </select>
                  </div>

                  {/* Stores Multi-pick */}
                  <div className="space-y-1">
                    <label className="text-xs font-bold text-slate-700">Found in which stores?</label>
                    <div className="flex flex-wrap gap-1.5 pt-1">
                      {STORES.filter(s => s !== "All Stores").map(st => {
                        const hasStore = newStores.includes(st);
                        return (
                          <button
                            type="button"
                            key={st}
                            onClick={() => {
                              setNewStores(prev => hasStore ? prev.filter(s => s !== st) : [...prev, st]);
                            }}
                            className={`px-2.5 py-1 rounded-lg text-xs font-semibold transition ${
                              hasStore 
                                ? "bg-emerald-700 text-white shadow-sm" 
                                : "bg-slate-100 text-slate-600 hover:bg-slate-200"
                            }`}
                          >
                            {hasStore ? "✓ " : ""}{st}
                          </button>
                        );
                      })}
                    </div>
                  </div>

                  {/* Ingredient Notes */}
                  <div className="space-y-1">
                    <label className="text-xs font-bold text-slate-700">Clean Features & Ingredients</label>
                    <textarea
                      placeholder="Why is it clean? (e.g. 100% grass-fed, zero seed oils, no cane sugar, fermented sourdough starter)..."
                      rows={3}
                      value={newNotes}
                      onChange={(e) => setNewNotes(e.target.value)}
                      className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs focus:ring-2 focus:ring-emerald-600 focus:outline-none"
                    />
                  </div>

                  <button
                    type="submit"
                    className="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-bold text-sm py-2.5 rounded-xl transition shadow-md mt-2"
                  >
                    Save to Family Grocery Library
                  </button>
                </form>
              </div>
            )}

          </main>

          {/* Sticky Bottom Navigation Bar */}
          <nav className="fixed bottom-0 left-0 right-0 max-w-4xl mx-auto bg-white/95 backdrop-blur-md border-t border-slate-200 px-4 py-2 z-40 flex items-center justify-around shadow-lg">
            <button
              onClick={() => setCurrentTab("catalog")}
              className={`flex flex-col items-center gap-0.5 ${currentTab === "catalog" ? "text-emerald-700 font-bold" : "text-slate-400 hover:text-slate-600"}`}
            >
              <span className="text-lg">🥑</span>
              <span className="text-[11px]">Foods</span>
            </button>

            <button
              onClick={() => setCurrentTab("decider")}
              className={`flex flex-col items-center gap-0.5 ${currentTab === "decider" ? "text-emerald-700 font-bold" : "text-slate-400 hover:text-slate-600"}`}
            >
              <span className="text-lg">🧭</span>
              <span className="text-[11px]">Decider</span>
            </button>

            <button
              onClick={() => setCurrentTab("add")}
              className={`flex flex-col items-center gap-0.5 ${currentTab === "add" ? "text-emerald-700 font-bold" : "text-slate-400 hover:text-slate-600"}`}
            >
              <span className="text-lg">📸</span>
              <span className="text-[11px]">Add New</span>
            </button>

            <button
              onClick={() => setCurrentTab("list")}
              className={`relative flex flex-col items-center gap-0.5 ${currentTab === "list" ? "text-emerald-700 font-bold" : "text-slate-400 hover:text-slate-600"}`}
            >
              <span className="text-lg">🛒</span>
              <span className="text-[11px]">List</span>
              {shoppingList.filter(i => !i.done).length > 0 && (
                <span className="absolute -top-1 right-1 bg-amber-400 text-slate-900 font-extrabold text-[9px] w-4 h-4 rounded-full flex items-center justify-center">
                  {shoppingList.filter(i => !i.done).length}
                </span>
              )}
            </button>
          </nav>

        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById("root"));
  </script>
</body>
</html>
